
name: Build AUREN APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract AUREN source ZIP
        run: unzip -o AUREN_Real_v1_Foundation.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build AUREN debug APK
        working-directory: AUREN_Real_v1
        run: gradle --no-daemon assembleDebug

      - name: Upload AUREN APK
        uses: actions/upload-artifact@v4
        with:
          name: AUREN-Real-v1.0-debug
          path: AUREN_Real_v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
