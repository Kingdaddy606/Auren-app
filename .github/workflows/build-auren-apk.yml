name: Build AUREN Daily Notification APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract exact AUREN source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="AUREN_Source_Daily_Notifications.zip"
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/AUREN_AI_Control_v3/settings.gradle.kts
          test -f extracted/AUREN_AI_Control_v3/app/src/main/java/com/auren/app/AurenDailyPlanner.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted/AUREN_AI_Control_v3
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUREN-Daily-Notifications-debug
          path: extracted/AUREN_AI_Control_v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
